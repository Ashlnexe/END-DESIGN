<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOOM Portfolio</title>
  <meta name="description" content="Portfolio of our premium architectural and interior designs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
  
  <header class="header">
    <div class="logo-container">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <!-- Left sloped wedge -->
        <path d="M2 20V14.5L11 9.5V20H2Z" />
        <!-- Right vertical pillar -->
        <path d="M13 6H22V20H13V6Z" />
      </svg>
      <span class="logo-text">BLOOM</span>
    </div>
    <div class="menu-icon">
      <div class="menu-line"></div>
      <div class="menu-line"></div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero-title">Portfolio</h1>
    </section>

    <section class="portfolio-section">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="interior">Interior</button>
        <button class="filter-btn" data-filter="exterior">Exterior</button>
        <button class="filter-btn" data-filter="animation">Animation</button>
      </div>

      <div class="gallery">
        <!-- Row 1: 50/50 -->
        <div class="gallery-item span-3" data-category="exterior">
          <img src="images/pexels-alex-qian-1180283-2343465.jpg" alt="House Exterior" class="gallery-img">
        </div>
        <div class="gallery-item span-3" data-category="interior">
          <img src="images/WhatsApp Image 2026-06-25 at 3.58.41 PM.jpeg" alt="Interior Arch" class="gallery-img">
        </div>

        <!-- Row 2: 3 equal columns -->
        <div class="gallery-item span-2" data-category="interior">
          <img src="interior1.jpg" alt="Bedroom Interior" class="gallery-img">
        </div>
        <div class="gallery-item span-2" data-category="exterior">
          <img src="images/WhatsApp Image 2026-06-25 at 3.58.42 PM.jpeg" alt="Pool" class="gallery-img">
        </div>
        <div class="gallery-item span-2 has-text" data-category="exterior">
          <img src="images/low-angle-greyscale-building-with-modern-brutalist-architecture-sunlight.jpg" alt="Dark House" class="gallery-img">
          <div class="overlay-text">
            <span class="title">Morven</span>
            <span class="subtitle">Scotland</span>
          </div>
        </div>

        <!-- Row 3: 50/50 -->
        <div class="gallery-item span-3" data-category="interior">
          <img src="interior2.jpg" alt="Wood Interior" class="gallery-img">
        </div>
        <div class="gallery-item span-3" data-category="interior">
          <img src="images/WhatsApp Image 2026-06-25 at 3.58.41 PM (1).jpeg" alt="Arch Ceiling" class="gallery-img">
        </div>
      </div>
    </section>
  </main>

  <script src="main.js?v=2"></script>
</body>
</html>
